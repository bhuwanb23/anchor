# Anchor — Render Blueprint (free tier)
# Docs: docs/deploy-render.md
#
# Free limits (Render):
# - No persistent disks → SQLite is ephemeral (lost on sleep / redeploy)
# - Services sleep after ~15 min idle; cold start ~1 min
# - WebSockets work while the instance is awake
#
# Live URLs (this deployment):
#   API:       https://anchor-api-o1ba.onrender.com
#   Dashboard: https://anchor-web-tvir.onrender.com
#
# If you recreate services with different names, update EVERY onrender.com
# value below (API + web) and clear the web build cache so NEXT_PUBLIC_* rebake.

services:
  - type: web
    name: anchor-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./control-plane/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: ENV
        value: production
      - key: PORT
        value: "8080"
      # Ephemeral path — free tier cannot attach a disk
      - key: DATABASE_PATH
        value: /tmp/anchor/yourplatform.db
      - key: DB_BACKUP_DIR
        value: /tmp/anchor/backups
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: "24"
      # Must match the browser Origin of the dashboard exactly (CORS)
      - key: FRONTEND_URL
        value: https://anchor-web-tvir.onrender.com
      - key: PUBLIC_BASE_URL
        value: https://anchor-api-o1ba.onrender.com
      - key: BASE_DOMAIN
        value: anchor-api-o1ba.onrender.com
      - key: WS_PATH
        value: /ws/agent
      - key: EMAIL_ENABLED
        value: "false"

  - type: web
    name: anchor-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./dashboard/Dockerfile
    dockerContext: .
    healthCheckPath: /
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Baked into the JS bundle at Docker build time — clear cache after changes
      - key: NEXT_PUBLIC_API_URL
        value: https://anchor-api-o1ba.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://anchor-api-o1ba.onrender.com/ws/browser
