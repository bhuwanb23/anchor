name: Validate Arm Optimization

# Phase 1 technical validation from docs/infer_idea_validation.md.
# Proves KleidiAI-enabled llama.cpp is measurable vs a generic Arm build.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate.yml"
      - "infer/**"
      - "BENCHMARKS.md"

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Confirm architecture
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake git curl ca-certificates python3 python3-pip

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$HOME/llama.cpp"
          cd "$HOME/llama.cpp"
          echo "llama.cpp commit=$(git rev-parse HEAD)"

      - name: Build generic (baseline) llama.cpp
        working-directory: ${{ runner.temp }}/../llama.cpp
        run: |
          cd "$HOME/llama.cpp"
          cmake -B build-generic \
            -DGGML_NATIVE=ON \
            -DGGML_CPU_KLEIDIAI=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build build-generic --config Release -j"$(nproc)" --target llama-bench llama-cli
          test -x build-generic/bin/llama-bench
          echo "GENERIC_BUILD=ok"

      - name: Build KleidiAI-optimized llama.cpp
        run: |
          cd "$HOME/llama.cpp"
          cmake -B build-kleidi \
            -DGGML_NATIVE=ON \
            -DGGML_CPU_KLEIDIAI=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build build-kleidi --config Release -j"$(nproc)" --target llama-bench llama-cli
          test -x build-kleidi/bin/llama-bench
          # Confirm KleidiAI was linked (not silently skipped)
          if grep -R "kleidiai\|KLEIDI" build-kleidi/CMakeCache.txt build-kleidi/ggml/src/CMakeFiles 2>/dev/null | head -5; then
            echo "KLEIDIAI_LINKED=yes"
          else
            echo "KLEIDIAI_LINKED=check_logs"
            grep -i kleidi build-kleidi/CMakeCache.txt || true
          fi
          grep -E "GGML_CPU_KLEIDIAI:BOOL=ON" build-kleidi/CMakeCache.txt

      - name: Download small GGUF model
        run: |
          mkdir -p "$HOME/models"
          # ~640MB Q4_K_M — small enough for CI, large enough for meaningful tokens/sec
          MODEL_URL="https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf"
          curl -L --fail --retry 3 -o "$HOME/models/model.gguf" "$MODEL_URL"
          ls -lh "$HOME/models/model.gguf"

      - name: Benchmark generic build
        run: |
          cd "$HOME/llama.cpp"
          ./build-generic/bin/llama-bench \
            -m "$HOME/models/model.gguf" \
            -p 128 -n 64 -r 3 \
            --output json \
            > "$HOME/bench-generic.json" || \
          ./build-generic/bin/llama-bench \
            -m "$HOME/models/model.gguf" \
            -p 128 -n 64 -r 3 \
            > "$HOME/bench-generic.txt"
          ls -la "$HOME"/bench-generic.* || true
          head -c 4000 "$HOME/bench-generic.json" 2>/dev/null || head -c 4000 "$HOME/bench-generic.txt"

      - name: Benchmark KleidiAI build
        run: |
          cd "$HOME/llama.cpp"
          ./build-kleidi/bin/llama-bench \
            -m "$HOME/models/model.gguf" \
            -p 128 -n 64 -r 3 \
            --output json \
            > "$HOME/bench-kleidi.json" || \
          ./build-kleidi/bin/llama-bench \
            -m "$HOME/models/model.gguf" \
            -p 128 -n 64 -r 3 \
            > "$HOME/bench-kleidi.txt"
          head -c 4000 "$HOME/bench-kleidi.json" 2>/dev/null || head -c 4000 "$HOME/bench-kleidi.txt"

      - name: Summarize results into artifact
        run: |
          python3 <<'PY'
          import json, os, pathlib, re, statistics, datetime
          home = pathlib.Path(os.path.expanduser("~"))
          out = pathlib.Path("ci-benchmark-results.md")

          def parse(path_json, path_txt):
              if path_json.exists():
                  try:
                      data = json.loads(path_json.read_text())
                      # llama-bench json is typically a list of rows
                      rows = data if isinstance(data, list) else data.get("results", [data])
                      tps = []
                      for r in rows:
                          for k in ("avg_ts", "tokens_per_second", "ts"):
                              if k in r and r[k]:
                                  tps.append(float(r[k]))
                                  break
                      if tps:
                          return statistics.median(tps), "json"
                  except Exception as e:
                      print("json parse failed", e)
              if path_txt.exists():
                  text = path_txt.read_text(errors="replace")
                  # Match tokens/sec style numbers from table output
                  nums = [float(x) for x in re.findall(r"(\d+\.\d+)\s*(?:t/s|tokens)", text, re.I)]
                  if not nums:
                      nums = [float(x) for x in re.findall(r"\b(\d{1,4}\.\d{1,3})\b", text)]
                  if nums:
                      return statistics.median(nums), "text"
              return None, None

          g, gs = parse(home / "bench-generic.json", home / "bench-generic.txt")
          k, ks = parse(home / "bench-kleidi.json", home / "bench-kleidi.txt")
          lines = [
              f"# CI benchmark run — {datetime.datetime.utcnow().isoformat()}Z",
              "",
              f"- Runner: `ubuntu-24.04-arm` (`aarch64`)",
              f"- Model: TinyLlama 1.1B Chat Q4_K_M",
              f"- Prompt tokens: 128 · generation: 64 · repeats: 3",
              "",
              "| Build | Median tokens/sec | Source |",
              "|---|---:|---|",
              f"| Generic (GGML_CPU_KLEIDIAI=OFF) | {g if g is not None else 'see raw'} | {gs or 'n/a'} |",
              f"| KleidiAI (GGML_CPU_KLEIDIAI=ON) | {k if k is not None else 'see raw'} | {ks or 'n/a'} |",
              "",
          ]
          if g and k and g > 0:
              pct = ((k - g) / g) * 100
              lines.append(f"**Improvement:** {pct:.1f}% ({k:.2f} vs {g:.2f} t/s)")
              lines.append("")
              lines.append("Paste these numbers into `BENCHMARKS.md` → Latest CI results.")
          out.write_text("\n".join(lines) + "\n")
          print(out.read_text())
          PY

      - name: Upload raw + summary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arm-benchmark-results
          path: |
            ci-benchmark-results.md
            /home/runner/bench-generic.json
            /home/runner/bench-generic.txt
            /home/runner/bench-kleidi.json
            /home/runner/bench-kleidi.txt
          if-no-files-found: warn
