name: Validate Arm Optimization

# Phase 1 technical validation — KleidiAI vs generic llama.cpp on arm64.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate.yml"
      - "infer/**"
      # Intentionally NOT BENCHMARKS.md / docs/ci — avoids loops when CI commits results

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      LLAMA_DIR: ${{ github.workspace }}/_llama.cpp
      MODEL_PATH: ${{ github.workspace }}/_models/model.gguf
      RESULTS_DIR: ${{ github.workspace }}/_bench_out

    steps:
      - uses: actions/checkout@v4

      - name: Confirm architecture
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake git curl ca-certificates python3

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$LLAMA_DIR"
          echo "llama.cpp commit=$(git -C "$LLAMA_DIR" rev-parse HEAD)"

      - name: Build generic (baseline) llama.cpp
        working-directory: ${{ env.LLAMA_DIR }}
        run: |
          cmake -B build-generic \
            -DGGML_NATIVE=ON \
            -DGGML_CPU_KLEIDIAI=OFF \
            -DLLAMA_CURL=OFF
          cmake --build build-generic --config Release -j"$(nproc)" --target llama-bench
          test -x build-generic/bin/llama-bench
          echo "GENERIC_BUILD=ok"

      - name: Build KleidiAI-optimized llama.cpp
        working-directory: ${{ env.LLAMA_DIR }}
        run: |
          cmake -B build-kleidi \
            -DGGML_NATIVE=ON \
            -DGGML_CPU_KLEIDIAI=ON \
            -DLLAMA_CURL=OFF
          cmake --build build-kleidi --config Release -j"$(nproc)" --target llama-bench
          test -x build-kleidi/bin/llama-bench
          grep -E "GGML_CPU_KLEIDIAI:BOOL=ON" build-kleidi/CMakeCache.txt
          echo "KLEIDI_BUILD=ok"

      - name: Download small GGUF model
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          MODEL_URL="https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf"
          curl -L --fail --retry 5 --retry-delay 5 -o "$MODEL_PATH" "$MODEL_URL"
          ls -lh "$MODEL_PATH"

      - name: Benchmark both builds
        run: |
          mkdir -p "$RESULTS_DIR"
          cd "$LLAMA_DIR"

          run_bench () {
            local bin="$1" out_base="$2"
            if "$bin" -m "$MODEL_PATH" -p 128 -n 64 -r 3 -o json > "${out_base}.json" 2>"${out_base}.err"; then
              echo "wrote ${out_base}.json"
            elif "$bin" -m "$MODEL_PATH" -p 128 -n 64 -r 3 --output json > "${out_base}.json" 2>>"${out_base}.err"; then
              echo "wrote ${out_base}.json (legacy flag)"
            else
              "$bin" -m "$MODEL_PATH" -p 128 -n 64 -r 3 > "${out_base}.txt" 2>>"${out_base}.err" || true
              echo "wrote ${out_base}.txt (plain)"
            fi
            head -c 3000 "${out_base}.json" 2>/dev/null || head -c 3000 "${out_base}.txt" 2>/dev/null || true
            echo
          }

          run_bench ./build-generic/bin/llama-bench "$RESULTS_DIR/bench-generic"
          run_bench ./build-kleidi/bin/llama-bench  "$RESULTS_DIR/bench-kleidi"
          ls -la "$RESULTS_DIR"

      - name: Summarize results
        run: |
          python3 <<'PY'
          import json, os, pathlib, re, statistics, datetime, subprocess

          results = pathlib.Path(os.environ["RESULTS_DIR"])
          out = pathlib.Path("ci-benchmark-results.md")
          llama = pathlib.Path(os.environ["LLAMA_DIR"])
          commit = ""
          try:
              commit = subprocess.check_output(["git", "-C", str(llama), "rev-parse", "HEAD"], text=True).strip()
          except Exception:
              pass

          def parse(base: pathlib.Path):
              jp, tp = base.with_suffix(".json"), base.with_suffix(".txt")
              if jp.exists() and jp.stat().st_size > 0:
                  try:
                      data = json.loads(jp.read_text())
                      rows = data if isinstance(data, list) else data.get("results", [data])
                      tps = []
                      for r in rows:
                          if not isinstance(r, dict):
                              continue
                          for k in ("avg_ts", "tokens_per_second", "ts", "n_tokens_second"):
                              if k in r and r[k] not in (None, 0, 0.0):
                                  tps.append(float(r[k]))
                                  break
                      if tps:
                          return statistics.median(tps), "json"
                  except Exception as e:
                      print("json parse failed:", e)
              if tp.exists() and tp.stat().st_size > 0:
                  text = tp.read_text(errors="replace")
                  nums = [float(x) for x in re.findall(r"(\d+\.\d+)\s*$", text, re.M)]
                  if not nums:
                      nums = [float(x) for x in re.findall(r"(\d+\.\d+)\s*(?:t/s|tok)", text, re.I)]
                  if nums:
                      return statistics.median(nums), "text"
              return None, None

          g, gs = parse(results / "bench-generic")
          k, ks = parse(results / "bench-kleidi")
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          pct = ((k - g) / g * 100) if g and k and g > 0 else None

          lines = [
              f"# CI benchmark run — {now}",
              "",
              "- Runner: `ubuntu-24.04-arm` (`aarch64`)",
              "- Model: TinyLlama 1.1B Chat Q4_K_M",
              "- Prompt tokens: 128 · generation: 64 · repeats: 3",
              f"- llama.cpp: `{commit or 'unknown'}`",
              "",
              "| Build | Median tokens/sec | Source |",
              "|---|---:|---|",
              f"| Generic (GGML_CPU_KLEIDIAI=OFF) | {f'{g:.2f}' if g is not None else 'see raw'} | {gs or 'n/a'} |",
              f"| KleidiAI (GGML_CPU_KLEIDIAI=ON) | {f'{k:.2f}' if k is not None else 'see raw'} | {ks or 'n/a'} |",
              "",
          ]
          if pct is not None:
              lines += [f"**Improvement:** {pct:.1f}% ({k:.2f} vs {g:.2f} t/s)", ""]
          else:
              lines += ["**Note:** Could not auto-parse tokens/sec — inspect raw JSON/TXT in the artifact.", ""]

          meta = {
              "date_utc": now,
              "generic_tps": g,
              "kleidi_tps": k,
              "improvement_pct": pct,
              "llama_commit": commit,
              "model": "tinyllama-1.1b-chat-v1.0.Q4_K_M",
              "p": 128,
              "n": 64,
              "r": 3,
              "run_url": os.environ.get("GITHUB_SERVER_URL", "https://github.com")
              + "/"
              + os.environ.get("GITHUB_REPOSITORY", "")
              + "/actions/runs/"
              + os.environ.get("GITHUB_RUN_ID", ""),
          }
          pathlib.Path("ci-benchmark-results.json").write_text(json.dumps(meta, indent=2) + "\n")
          out.write_text("\n".join(lines) + "\n")
          print(out.read_text())
          print(json.dumps(meta, indent=2))

          bench = pathlib.Path("BENCHMARKS.md")
          if bench.exists() and g is not None and k is not None:
              text = bench.read_text()
              row = (
                  f"| {now[:10]} | {g:.2f} | {k:.2f} | "
                  f"{pct:.1f}% | `{commit[:7] if commit else 'n/a'}` · "
                  f"[run]({meta['run_url']}) |"
              )
              marker = "| _pending first workflow run_ | — | — | — | Fill from `ci-benchmark-results.md` artifact |"
              if marker in text:
                  text = text.replace(marker, row)
              else:
                  needle = "|---|---:|---:|---:|---|\n"
                  idx = text.find(needle)
                  if idx != -1:
                      insert_at = idx + len(needle)
                      text = text[:insert_at] + row + "\n" + text[insert_at:]
              bench.write_text(text)
          PY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-benchmark-results
          path: |
            ci-benchmark-results.md
            ci-benchmark-results.json
            _bench_out/
          if-no-files-found: warn

      - name: Publish results into the repo
        if: success()
        run: |
          mkdir -p docs/ci
          cp ci-benchmark-results.md docs/ci/arm-benchmark-latest.md
          cp ci-benchmark-results.json docs/ci/arm-benchmark-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BENCHMARKS.md docs/ci/arm-benchmark-latest.md docs/ci/arm-benchmark-latest.json
          if git diff --staged --quiet; then
            echo "No result changes to commit"
            exit 0
          fi
          git commit -m "chore(ci): publish Arm KleidiAI benchmark results [skip ci]"
          git push
