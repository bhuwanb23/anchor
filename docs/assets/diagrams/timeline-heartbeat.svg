<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="t d">
  <title id="t">Anchor - Heartbeat timeline</title>
  <desc id="d">Wide short timeline of agent health reports and control-plane reactions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A4D38"/><stop offset="50%" stop-color="#0F6B4D"/><stop offset="100%" stop-color="#12382C"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="720" fill="url(#bg)"/>
  <text x="750" y="56" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#A8E0C8" letter-spacing="3">TIMELINE (WIDE)</text>
  <text x="750" y="96" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="32" font-weight="800" fill="#F4FBF7">Agent heartbeat</text>
  <text x="750" y="128" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="15" fill="#A8E0C8">~30s metrics ticks along one WebSocket session</text>

  <!-- Timeline axis -->
  <line x1="80" y1="360" x2="1420" y2="360" stroke="#7DDBB0" stroke-width="4" stroke-linecap="round"/>

  <!-- ticks -->
  <g fill="#F4FBF7" font-family="Consolas,ui-monospace,monospace" font-size="12" text-anchor="middle">
    <circle cx="180" cy="360" r="10" fill="#7DDBB0"/>
    <text x="180" y="300" fill="#A8E0C8">t+0s</text>
    <rect x="100" y="400" width="160" height="70" rx="12" fill="#12382C" stroke="#7DDBB0"/>
    <text x="180" y="430" fill="#F4FBF7" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="700">connect</text>
    <text x="180" y="454" fill="#A8E0C8">WSS handshake</text>

    <circle cx="420" cy="360" r="10" fill="#F4FBF7"/>
    <text x="420" y="300" fill="#A8E0C8">t+30s</text>
    <rect x="340" y="180" width="160" height="70" rx="12" fill="#F4FBF7"/>
    <text x="420" y="210" fill="#0E1F1A" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="700">health_report</text>
    <text x="420" y="234" fill="#4A635A">CPU RAM disk</text>
    <line x1="420" y1="250" x2="420" y2="350" stroke="#7DDBB0" stroke-width="2"/>

    <circle cx="660" cy="360" r="10" fill="#F4FBF7"/>
    <text x="660" y="300" fill="#A8E0C8">t+60s</text>
    <rect x="580" y="400" width="160" height="70" rx="12" fill="#12382C" stroke="#7DDBB0"/>
    <text x="660" y="430" fill="#F4FBF7" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="700">health_report</text>
    <text x="660" y="454" fill="#A8E0C8">containers</text>

    <circle cx="900" cy="360" r="10" fill="#F4FBF7"/>
    <text x="900" y="300" fill="#A8E0C8">t+90s</text>
    <rect x="820" y="180" width="160" height="70" rx="12" fill="#F4FBF7"/>
    <text x="900" y="210" fill="#0E1F1A" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="700">ping / pong</text>
    <text x="900" y="234" fill="#4A635A">keepalive</text>
    <line x1="900" y1="250" x2="900" y2="350" stroke="#7DDBB0" stroke-width="2"/>

    <circle cx="1140" cy="360" r="10" fill="#C9A227"/>
    <text x="1140" y="300" fill="#E8D48A">blip</text>
    <rect x="1060" y="400" width="160" height="70" rx="12" fill="#12382C" stroke="#C9A227"/>
    <text x="1140" y="430" fill="#F4FBF7" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="700">gap</text>
    <text x="1140" y="454" fill="#E8D48A">network blip</text>

    <circle cx="1360" cy="360" r="10" fill="#7DDBB0"/>
    <text x="1360" y="300" fill="#A8E0C8">resume</text>
    <rect x="1280" y="180" width="160" height="70" rx="12" fill="#F4FBF7"/>
    <text x="1360" y="210" fill="#0E1F1A" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="700">reconnect</text>
    <text x="1360" y="234" fill="#4A635A">same agent id</text>
    <line x1="1360" y1="250" x2="1360" y2="350" stroke="#7DDBB0" stroke-width="2"/>
  </g>

  <rect x="80" y="560" width="1340" height="80" rx="14" fill="#082E22"/>
  <text x="750" y="596" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="600" fill="#A8E0C8">UI shows Live while ticks arrive - Reconnecting on gap - Offline if WSS stays down</text>
  <text x="750" y="624" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#7DDBB0">Apps keep running on the VPS during a blip</text>

  <rect x="0" y="668" width="1500" height="52" fill="#082E22"/>
  <text x="750" y="700" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#7DDBB0">Wide 1500x720 - heartbeat timeline</text>
</svg>
