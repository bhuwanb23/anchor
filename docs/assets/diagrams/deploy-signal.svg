<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Anchor - How a deploy travels</title>
  <desc id="desc">Signal path from dashboard through control plane WebSocket to the agent running Docker.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A4D38"/>
      <stop offset="45%" stop-color="#0F6B4D"/>
      <stop offset="100%" stop-color="#12382C"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DDBB0"/>
      <stop offset="50%" stop-color="#F4FBF7"/>
      <stop offset="100%" stop-color="#7DDBB0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="tip" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7DDBB0"/>
    </marker>
  </defs>

  <rect width="1500" height="720" fill="url(#paper)"/>

  <g opacity="0.14" stroke="#A8E0C8" stroke-width="1" fill="none">
    <path d="M40 40 H480 V120"/>
    <path d="M1460 40 H1020 V120"/>
    <path d="M40 680 H400"/>
    <path d="M1460 680 H1100"/>
  </g>

  <text x="750" y="56" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="34" font-weight="800" fill="#F4FBF7">How a deploy travels</text>
  <text x="750" y="90" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="16" fill="#A8E0C8">One click to one command to one container. The wire is WebSocket.</text>

  <!-- Wire edge to edge -->
  <line x1="80" y1="360" x2="1420" y2="360" stroke="url(#wire)" stroke-width="5" stroke-linecap="round"/>
  <g filter="url(#glow)" fill="#F4FBF7">
    <circle cx="280" cy="360" r="6"/>
    <circle cx="540" cy="360" r="6"/>
    <circle cx="800" cy="360" r="6"/>
    <circle cx="1060" cy="360" r="6"/>
    <circle cx="1300" cy="360" r="6"/>
  </g>

  <g transform="translate(80,360)">
    <circle r="16" fill="#7DDBB0"/>
    <rect x="-10" y="-168" width="220" height="120" rx="18" fill="#F4FBF7"/>
    <text x="100" y="-120" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F6B4D" letter-spacing="2">YOU</text>
    <text x="100" y="-90" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="20" font-weight="800" fill="#0E1F1A">Dashboard</text>
    <text x="100" y="-62" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#4A635A">Click Deploy</text>
    <line x1="100" y1="-48" x2="100" y2="-16" stroke="#7DDBB0" stroke-width="2.5"/>
  </g>

  <g transform="translate(420,360)">
    <circle r="16" fill="#7DDBB0"/>
    <rect x="-20" y="48" width="240" height="120" rx="18" fill="#12382C" stroke="#7DDBB0" stroke-width="1.5"/>
    <text x="100" y="88" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="700" fill="#7DDBB0" letter-spacing="2">CONTROL PLANE</text>
    <text x="100" y="118" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="20" font-weight="800" fill="#F4FBF7">Queue command</text>
    <text x="100" y="146" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#A8E0C8">Auth - persist - route</text>
    <line x1="100" y1="16" x2="100" y2="48" stroke="#7DDBB0" stroke-width="2.5"/>
  </g>

  <g transform="translate(750,360)">
    <circle r="16" fill="#F4FBF7"/>
    <rect x="-20" y="-168" width="240" height="120" rx="18" fill="#F4FBF7"/>
    <text x="100" y="-120" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F6B4D" letter-spacing="2">REALTIME</text>
    <text x="100" y="-90" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="20" font-weight="800" fill="#0E1F1A">WebSocket hub</text>
    <text x="100" y="-62" text-anchor="middle" font-family="Consolas,ui-monospace,monospace" font-size="13" fill="#4A635A">wss - /ws/agent</text>
    <line x1="100" y1="-48" x2="100" y2="-16" stroke="#7DDBB0" stroke-width="2.5"/>
  </g>

  <g transform="translate(1080,360)">
    <circle r="16" fill="#7DDBB0"/>
    <rect x="-20" y="48" width="240" height="120" rx="18" fill="#12382C" stroke="#7DDBB0" stroke-width="1.5"/>
    <text x="100" y="88" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="700" fill="#7DDBB0" letter-spacing="2">YOUR VPS</text>
    <text x="100" y="118" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="20" font-weight="800" fill="#F4FBF7">Agent receives</text>
    <text x="100" y="146" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#A8E0C8">Offline queue if needed</text>
    <line x1="100" y1="16" x2="100" y2="48" stroke="#7DDBB0" stroke-width="2.5"/>
  </g>

  <g transform="translate(1380,360)">
    <circle r="16" fill="#F4FBF7"/>
    <rect x="-190" y="-168" width="220" height="120" rx="18" fill="#F4FBF7"/>
    <text x="-80" y="-120" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F6B4D" letter-spacing="2">RUNTIME</text>
    <text x="-80" y="-90" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="20" font-weight="800" fill="#0E1F1A">Docker runs it</text>
    <text x="-80" y="-62" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#4A635A">Caddy publishes HTTPS</text>
    <line x1="-80" y1="-48" x2="-80" y2="-16" stroke="#7DDBB0" stroke-width="2.5"/>
  </g>

  <path d="M1380 520 C1100 600, 400 600, 120 520" fill="none" stroke="#7DDBB0" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.65" marker-end="url(#tip)"/>
  <text x="750" y="600" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="600" fill="#A8E0C8">Progress and logs stream back on the same wire</text>

  <rect x="0" y="668" width="1500" height="52" fill="#082E22"/>
  <text x="750" y="700" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="600" fill="#7DDBB0">Nothing about this path requires you to SSH into the machine.</text>
</svg>
