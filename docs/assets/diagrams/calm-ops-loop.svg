<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Anchor - Calm operations loop</title>
  <desc id="desc">Five stages: connect, deploy, watch, heal, backup - without SSH.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4FBF7"/>
      <stop offset="100%" stop-color="#E4EFE9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F6B4D"/>
      <stop offset="50%" stop-color="#1A8F68"/>
      <stop offset="100%" stop-color="#0A4D38"/>
    </linearGradient>
    <filter id="lift">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0E1F1A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#paper)"/>

  <rect x="0" y="0" width="1200" height="100" fill="#FFFFFF" opacity="0.5"/>
  <text x="600" y="48" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="34" font-weight="800" fill="#0E1F1A">The calm ops loop</text>
  <text x="600" y="80" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="16" fill="#4A635A">One continuous cycle. No terminal. No babysitting.</text>

  <!-- Larger ring, lower center to use space -->
  <circle cx="600" cy="620" r="430" fill="none" stroke="#C5D9CF" stroke-width="1" stroke-dasharray="2 10"/>
  <circle cx="600" cy="620" r="340" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round"/>

  <g stroke="#F4FBF7" stroke-width="3.5" stroke-linecap="round">
    <line x1="600" y1="268" x2="600" y2="288"/>
    <line x1="920" y1="480" x2="905" y2="495"/>
    <line x1="860" y1="880" x2="844" y2="866"/>
    <line x1="340" y1="880" x2="356" y2="866"/>
    <line x1="280" y1="480" x2="295" y2="495"/>
  </g>

  <g filter="url(#lift)">
    <circle cx="600" cy="620" r="140" fill="#FFFFFF" stroke="#0F6B4D" stroke-width="3"/>
  </g>
  <text x="600" y="592" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="16" font-weight="700" fill="#0F6B4D" letter-spacing="2">NO SSH</text>
  <text x="600" y="630" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="26" font-weight="800" fill="#0E1F1A">Dashboard</text>
  <text x="600" y="660" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#4A635A">is the only control</text>

  <!-- Nodes closer to edges -->
  <g filter="url(#lift)" transform="translate(600,250)">
    <rect x="-130" y="-56" width="260" height="112" rx="22" fill="#0F6B4D"/>
    <text x="0" y="-12" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#A8E0C8" letter-spacing="2">01</text>
    <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="24" font-weight="800" fill="#F4FBF7">Connect</text>
    <text x="0" y="44" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#C5EBD8">Paste install - agent joins</text>
  </g>

  <g filter="url(#lift)" transform="translate(980,470)">
    <rect x="-130" y="-56" width="260" height="112" rx="22" fill="#FFFFFF" stroke="#0F6B4D" stroke-width="2.5"/>
    <text x="0" y="-12" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F6B4D" letter-spacing="2">02</text>
    <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="24" font-weight="800" fill="#0E1F1A">Deploy</text>
    <text x="0" y="44" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#4A635A">Image or template - one click</text>
  </g>

  <g filter="url(#lift)" transform="translate(900,920)">
    <rect x="-130" y="-56" width="260" height="112" rx="22" fill="#FFFFFF" stroke="#0F6B4D" stroke-width="2.5"/>
    <text x="0" y="-12" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F6B4D" letter-spacing="2">03</text>
    <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="24" font-weight="800" fill="#0E1F1A">Watch</text>
    <text x="0" y="44" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#4A635A">CPU - RAM - disk - live logs</text>
  </g>

  <g filter="url(#lift)" transform="translate(300,920)">
    <rect x="-130" y="-56" width="260" height="112" rx="22" fill="#FFFFFF" stroke="#0F6B4D" stroke-width="2.5"/>
    <text x="0" y="-12" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F6B4D" letter-spacing="2">04</text>
    <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="24" font-weight="800" fill="#0E1F1A">Heal</text>
    <text x="0" y="44" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#4A635A">Plain-English alerts - auto-fix</text>
  </g>

  <g filter="url(#lift)" transform="translate(220,470)">
    <rect x="-130" y="-56" width="260" height="112" rx="22" fill="#FFFFFF" stroke="#0F6B4D" stroke-width="2.5"/>
    <text x="0" y="-12" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F6B4D" letter-spacing="2">05</text>
    <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="24" font-weight="800" fill="#0E1F1A">Backup</text>
    <text x="0" y="44" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#4A635A">Daily restic - restore calmly</text>
  </g>

  <rect x="0" y="1148" width="1200" height="52" fill="#0F6B4D"/>
  <text x="600" y="1180" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="600" fill="#F4FBF7">The loop never asks you to open SSH - the agent closes it for you.</text>
</svg>
