<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Anchor - Calm operations loop</title>
  <desc id="desc">Five stages: connect, deploy, watch, heal, backup - without SSH.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4FBF7"/>
      <stop offset="100%" stop-color="#E4EFE9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F6B4D"/>
      <stop offset="50%" stop-color="#1A8F68"/>
      <stop offset="100%" stop-color="#0A4D38"/>
    </linearGradient>
    <filter id="lift">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0E1F1A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#paper)" rx="24"/>

  <text x="600" y="72" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="34" font-weight="800" fill="#0E1F1A">The calm ops loop</text>
  <text x="600" y="108" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="16" fill="#4A635A">One continuous cycle. No terminal. No babysitting.</text>

  <circle cx="600" cy="640" r="390" fill="none" stroke="#C5D9CF" stroke-width="1" stroke-dasharray="2 10"/>
  <circle cx="600" cy="640" r="300" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round" opacity="0.92"/>

  <g stroke="#F4FBF7" stroke-width="3" stroke-linecap="round">
    <line x1="600" y1="332" x2="600" y2="348"/>
    <line x1="880" y1="520" x2="868" y2="532"/>
    <line x1="820" y1="860" x2="806" y2="848"/>
    <line x1="380" y1="860" x2="394" y2="848"/>
    <line x1="320" y1="520" x2="332" y2="532"/>
  </g>

  <g filter="url(#lift)">
    <circle cx="600" cy="640" r="118" fill="#FFFFFF" stroke="#0F6B4D" stroke-width="2"/>
  </g>
  <text x="600" y="620" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#0F6B4D" letter-spacing="2">NO SSH</text>
  <text x="600" y="652" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="22" font-weight="800" fill="#0E1F1A">Dashboard</text>
  <text x="600" y="678" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#4A635A">is the only control</text>

  <g filter="url(#lift)" transform="translate(600,340)">
    <rect x="-110" y="-48" width="220" height="96" rx="20" fill="#0F6B4D"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="700" fill="#A8E0C8" letter-spacing="2">01</text>
    <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="20" font-weight="800" fill="#F4FBF7">Connect</text>
    <text x="0" y="40" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#C5EBD8">Paste install - agent joins</text>
  </g>

  <g filter="url(#lift)" transform="translate(900,500)">
    <rect x="-110" y="-48" width="220" height="96" rx="20" fill="#FFFFFF" stroke="#0F6B4D" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F6B4D" letter-spacing="2">02</text>
    <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="20" font-weight="800" fill="#0E1F1A">Deploy</text>
    <text x="0" y="40" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#4A635A">Image or template - one click</text>
  </g>

  <g filter="url(#lift)" transform="translate(860,860)">
    <rect x="-110" y="-48" width="220" height="96" rx="20" fill="#FFFFFF" stroke="#0F6B4D" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F6B4D" letter-spacing="2">03</text>
    <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="20" font-weight="800" fill="#0E1F1A">Watch</text>
    <text x="0" y="40" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#4A635A">CPU - RAM - disk - live logs</text>
  </g>

  <g filter="url(#lift)" transform="translate(340,860)">
    <rect x="-110" y="-48" width="220" height="96" rx="20" fill="#FFFFFF" stroke="#0F6B4D" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F6B4D" letter-spacing="2">04</text>
    <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="20" font-weight="800" fill="#0E1F1A">Heal</text>
    <text x="0" y="40" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#4A635A">Plain-English alerts - auto-fix</text>
  </g>

  <g filter="url(#lift)" transform="translate(300,500)">
    <rect x="-110" y="-48" width="220" height="96" rx="20" fill="#FFFFFF" stroke="#0F6B4D" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F6B4D" letter-spacing="2">05</text>
    <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="20" font-weight="800" fill="#0E1F1A">Backup</text>
    <text x="0" y="40" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#4A635A">Daily restic - restore calmly</text>
  </g>

  <text x="600" y="1145" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#4A635A">The loop never asks you to open SSH - the agent closes it for you.</text>
</svg>
