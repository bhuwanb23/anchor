<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
  </style>
</head>
<body>
  <img id="d" alt="diagram"/>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("d").src = params.get("src") || "ownership-map.svg";
  </script>
</body>
</html>
