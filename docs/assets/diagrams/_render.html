<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #EEF4F1; }
    img { display: block; width: 100vw; height: 100vh; object-fit: fill; }
  </style>
</head>
<body>
  <img id="d" alt="diagram"/>
  <script>
    const params = new URLSearchParams(location.search);
    const src = params.get("src") || "ownership-map.svg";
    document.getElementById("d").src = src;
  </script>
</body>
</html>
