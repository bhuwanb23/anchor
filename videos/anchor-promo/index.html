<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Anchor Promo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f6f8fa;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
      .progress-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        height: 3px;
        background: #1f6feb;
        z-index: 9999;
        transform-origin: 0 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-qbnw" id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <!-- Frame 1: Hook - "Own your server. Don't babysit it." -->
      <div data-hf-id="hf-7tbs" id="frame-01-hook" class="clip" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="0" data-duration="7" data-track-index="1"></div>

      <!-- Frame 2: Pain - "The babysit loop" -->
      <div data-hf-id="hf-5sac" id="frame-02-pain" class="clip" data-composition-id="02-pain" data-composition-src="compositions/frames/02-pain.html" data-start="7" data-duration="9" data-track-index="2"></div>

      <!-- Frame 3: Tease - "Your server, managed." -->
      <div data-hf-id="hf-sw0h" id="frame-03-tease" class="clip" data-composition-id="03-tease" data-composition-src="compositions/frames/03-tease.html" data-start="16" data-duration="8" data-track-index="3"></div>

      <!-- Frame 4: Mechanism - How it works -->
      <div data-hf-id="hf-wf8o" id="frame-04-mechanism" class="clip" data-composition-id="04-mechanism" data-composition-src="compositions/frames/04-mechanism.html" data-start="24" data-duration="12" data-track-index="4"></div>

      <!-- Frame 5: Value - What the agent does -->
      <div data-hf-id="hf-z5h3" id="frame-05-value" class="clip" data-composition-id="05-value" data-composition-src="compositions/frames/05-value.html" data-start="36" data-duration="12" data-track-index="5"></div>

      <!-- Frame 6: CTA - "Bring your own server" -->
      <div data-hf-id="hf-3lf7" id="frame-06-cta" class="clip" data-composition-id="06-cta" data-composition-src="compositions/frames/06-cta.html" data-start="48" data-duration="12" data-track-index="6"></div>

      <!-- Progress bar -->
      <div data-hf-id="hf-jbhb" id="progress-bar" class="progress-bar clip" data-start="0" data-duration="60" data-track-index="100"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      // Progress bar animation
      const progressBar = document.getElementById("progress-bar");
      if (progressBar) {
        tl.fromTo(
          progressBar,
          { scaleX: 0 },
          { scaleX: 1, duration: 60, ease: "none" },
          0
        );
      }

      window.__timelines["main"] = tl;

      // Listen for hf-seek events to sync the timeline
      document.addEventListener("hf-seek", (event) => {
        const time = event.detail.time;
        if (window.__timelines["main"]) {
          window.__timelines["main"].seek(time);
        }
      });
    </script>
  </body>
</html>
