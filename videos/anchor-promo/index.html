    <style>

        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f6f8fa;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
      }

  </head>
  <body>
    <div data-hf-id="hf-qbnw" id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">

      <div data-hf-id="hf-t81r" id="frame-03" class="clip" data-composition-id="03-tease" data-composition-src="compositions/frames/03-tease.html" data-start="17" data-duration="8" data-track-index="3"></div>

      <div data-hf-id="hf-mtaf" id="frame-04" class="clip" data-composition-id="04-mechanism" data-composition-src="compositions/frames/04-mechanism.html" data-start="25" data-duration="12" data-track-index="4"></div>

      <!-- Captions track -->
      <div data-hf-id="hf-jcjo" id="captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="60" data-track-index="100"></div>

      <!-- BGM bed (captions-only piece — soft under SFX) -->

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 60 }, 0);
      // BGM fades are baked into assets/bgm/track.mp3 (avoids scripted-volume browser probe)
      window.__timelines["main"] = tl;

      document.addEventListener("hf-seek", (event) => {
        const time = event.detail.time;
        if (window.__timelines["main"]) {
          window.__timelines["main"].seek(time);
        }
      });
    </script>
  </body>
</html>
