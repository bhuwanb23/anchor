<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F8FA"/>
      <stop offset="100%" stop-color="#EAF0F6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6FA8FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)" rx="12"/>

  <!-- Wave motif, bottom of banner -->
  <path d="M0,300 C300,270 900,330 1200,300 L1200,360 L0,360 Z"
        fill="url(#wave)"/>
  <path d="M0,318 C300,295 900,342 1200,318 L1200,360 L0,360 Z"
        fill="#1F6FEB" opacity="0.25"/>

  <!-- Wordmark -->
  <text x="600" y="182" text-anchor="middle"
        font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="112" font-weight="700"
        fill="#0B1B2B" letter-spacing="-2">Anchor</text>

  <!-- Subline -->
  <text x="600" y="240" text-anchor="middle"
        font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="30" font-weight="400"
        fill="#1F6FEB" letter-spacing="0.5">Own your server. Don't babysit it.</text>
</svg>
