<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template id="04-mechanism-template">
  <div id="root-04-mechanism" class="frame-root clip" data-composition-id="04-mechanism" data-start="0" data-duration="12" data-track-index="0" data-width="1920" data-height="1080">
    <div class="ground"></div>
    <div class="header-block">
      <div class="accent-line clip" id="m4-accent" data-start="0.15" data-duration="11.85" data-track-index="1"></div>
      <div class="eyebrow clip" id="m4-eyebrow" data-start="0.2" data-duration="11.8" data-track-index="2">HOW IT WORKS</div>
      <h2 class="h2 clip" id="m4-h2" data-start="0.35" data-duration="11.65" data-track-index="3">Three pieces, one connection.</h2>
    </div>
    <div class="diagram-wrap clip" id="m4-diagram" data-start="1.0" data-duration="11.0" data-track-index="4">
      <img src="../../assets/architecture.png" alt="Architecture diagram showing Agent on your server, Control Plane, and Dashboard" class="diagram-img" />
    </div>
    <div class="glow clip" id="m4-glow" data-start="1.3" data-duration="10.7" data-track-index="5"></div>
  </div>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap");
    .frame-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; container-type: size; font-family: "Inter", system-ui, sans-serif; }
    .ground { position: absolute; inset: 0; background: #f6f8fa; }
    .header-block { position: absolute; left: 5cqw; top: 140px; z-index: 3; }
    .accent-line { width: 60px; height: 4px; border-radius: 2px; background: #1f6feb; margin-bottom: 22px; }
    .eyebrow { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 15.4px; letter-spacing: 0.08em; text-transform: uppercase; color: #1f6feb; margin-bottom: 18px; }
    .h2 { margin: 0; font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 50px; line-height: 1.1; letter-spacing: -0.02em; color: #0b1b2b; }
    .diagram-wrap { position: absolute; left: 5cqw; top: 320px; width: 90cqw; height: 600px; z-index: 2; overflow: hidden; }
    .diagram-img { width: 100%; height: 100%; object-fit: contain; object-position: left top; opacity: 0.95; }
    .glow { position: absolute; left: 50%; top: 540px; width: 1100px; height: 620px; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(13,64,142,0.88) 0%, rgba(13,64,142,0) 74%); opacity: 0; transform-origin: 50% 50%; z-index: 1; pointer-events: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var rootFrag = document.getElementById("04-mechanism-template").content;
      var accent = rootFrag.getElementById("m4-accent");
      var eyebrow = rootFrag.getElementById("m4-eyebrow");
      var h2 = rootFrag.getElementById("m4-h2");
      var diagram = rootFrag.getElementById("m4-diagram");
      var glow = rootFrag.getElementById("m4-glow");
      var TOTAL = 12.0;
      var GLOW_PEAK = 0.15;
      tl.fromTo(accent, { scaleX: 0, opacity: 0, transformOrigin: "0% 50%" }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.15);
      tl.fromTo(eyebrow, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo(h2, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.35);
      tl.fromTo(diagram, { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.75, ease: "power3.out" }, 1.0);
      tl.fromTo(glow, { opacity: 0, scale: 0.9 }, { opacity: GLOW_PEAK, scale: 1, duration: 1.1, ease: "power2.out" }, 1.3);
      var camX = { val: 0 };
      tl.to(camX, { val: 180, duration: 8.0, ease: "circ.inOut",
        onUpdate: function () {
          diagram.style.transform = "translateX(" + camX.val + "px)";
        }
      }, 2.0);
      var phase = { p: 0 };
      var BREATHE_START = 2.8;
      var BREATHE_DUR = TOTAL - BREATHE_START;
      var CYCLES = BREATHE_DUR / 3.8;
      var BASE_OP = 0.15, OP_AMP = 0.022, SC_AMP = 0.006, FADE_FRAC = 0.18;
      tl.to(phase, {
        p: Math.PI * 2 * CYCLES, duration: BREATHE_DUR, ease: "none",
        onUpdate: function () {
          var t = phase.p / (Math.PI * 2 * CYCLES);
          var env = t < 1 - FADE_FRAC ? 1 : (1 - t) / FADE_FRAC;
          var s = Math.sin(phase.p);
          glow.style.opacity = String(BASE_OP + s * OP_AMP * env);
          glow.style.transform = "translateX(-50%) scale(" + (1 + s * SC_AMP * env) + ")";
        }
      }, BREATHE_START);
      window.__timelines["04-mechanism"] = tl;
    })();
  </script>
</template>
</body>
</html>
