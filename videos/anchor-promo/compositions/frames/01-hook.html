  </div>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap");
    #root-01-hook { position: relative; width: 1920px; height: 1080px; overflow: hidden; container-type: size; font-family: "Inter", system-ui, sans-serif; background: #f6f8fa; }
    .ground { position: absolute; inset: 0; background: #f6f8fa; }
    .diag-panel { position: absolute; top: 0; right: 0; width: 36%; height: 100%; background: rgba(30,43,250,0.08); clip-path: polygon(26% 0, 100% 0, 100% 100%, 0 100%); }
    .glow { position: absolute; left: -160px; top: 140px; width: 1400px; height: 760px; background: radial-gradient(closest-side, rgba(13,64,142,0.95) 0%, rgba(13,64,142,0) 74%); opacity: 0; transform-origin: 50% 50%; z-index: 1; pointer-events: none; }
    .copy-block { position: absolute; left: 5cqw; top: 250px; width: 52cqw; z-index: 2; }
    .accent-line { width: 60px; height: 4px; border-radius: 2px; background: #1f6feb; margin-bottom: 26px; }
    .eyebrow { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 15.4px; letter-spacing: 0.08em; text-transform: uppercase; color: #1f6feb; margin-bottom: 20px; }
    .headline { margin: 0; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 76px; line-height: 1.08; letter-spacing: -0.02em; color: #0b1b2b; transform-origin: 50% 50%; will-change: transform, opacity; }
    .hl-line { display: block; white-space: nowrap; }
    .dot-grid { position: absolute; right: 132px; top: 122px; display: grid; grid-template-columns: repeat(3, 10px); gap: 14px; z-index: 1; width: 58px; height: 58px; }

  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var rootFrag = document.getElementById("01-hook-template").content;
      var headline = rootFrag.getElementById("hk-headline");
      var glow = rootFrag.getElementById("hk-glow");
      var accentLine = rootFrag.getElementById("hk-accentline");
      var eyebrow = rootFrag.getElementById("hk-eyebrow");
      var dotGrid = rootFrag.getElementById("hk-dotgrid");
      var GLOW_PEAK = 0.22;
      var IDLE_START = 2.2;
      var TOTAL = 7.0;
      var IDLE_DUR = TOTAL - IDLE_START;
      var IDLE_PERIOD = 3.0;
      var CYCLES = IDLE_DUR / IDLE_PERIOD;
      var SCALE_AMP = 0.01;
      var Y_AMP = 2.5;
      var FADE_FRAC = 0.2;
      tl.fromTo(headline, { scale: 0.92, y: 24, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.66, ease: "power3.out" }, 0.2);
      tl.fromTo(accentLine, { scaleX: 0, opacity: 0, transformOrigin: "0% 50%" }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo(eyebrow, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.28);
      tl.fromTo(dotGrid, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.9);
      tl.fromTo(glow, { opacity: 0, scale: 0.9 }, { opacity: GLOW_PEAK, scale: 1, duration: 1.1, ease: "power2.out" }, 0.7);
      var glowPhase = { p: 0 };
      var GLOW_IDLE_START = 1.8;
      var GLOW_IDLE_DUR = TOTAL - GLOW_IDLE_START;
      var GLOW_CYCLES = GLOW_IDLE_DUR / 3.4;
      tl.to(glowPhase, {
        p: Math.PI * 2 * GLOW_CYCLES, duration: GLOW_IDLE_DUR, ease: "none",
        onUpdate: function () {
          var t = glowPhase.p / (Math.PI * 2 * GLOW_CYCLES);
          var env = t < 1 - FADE_FRAC ? 1 : (1 - t) / FADE_FRAC;
          var s = Math.sin(glowPhase.p);
          glow.style.opacity = String(GLOW_PEAK + s * 0.02 * env);
          glow.style.transform = "scale(" + (1 + s * 0.008 * env) + ")";
        }
      }, GLOW_IDLE_START);
      var phase = { p: 0 };
      tl.to(phase, {
        p: Math.PI * 2 * CYCLES, duration: IDLE_DUR, ease: "none",
        onUpdate: function () {
          var t = phase.p / (Math.PI * 2 * CYCLES);
          var env = t < 1 - FADE_FRAC ? 1 : (1 - t) / FADE_FRAC;
          var s = Math.sin(phase.p);
          headline.style.transform = "translateY(" + (s * Y_AMP * env) + "px) scale(" + (1 + s * SCALE_AMP * env) + ")";
        }
      }, IDLE_START);
      window.__timelines["01-hook"] = tl;
    })();
  </script>
