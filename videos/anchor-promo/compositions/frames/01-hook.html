<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap");
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; container-type: size; font-family: "Inter", system-ui, sans-serif; background: #f6f8fa; }
  .ground { position: absolute; inset: 0; background: #f6f8fa; }
  .grid-bg { position: absolute; inset: 0; opacity: 0;
    background-image: linear-gradient(rgba(31,111,235,0.055) 1px, transparent 1px), linear-gradient(90deg, rgba(31,111,235,0.055) 1px, transparent 1px);
    background-size: 64px 64px; }
  .diag-panel { position: absolute; top: 0; right: 0; width: 42%; height: 100%; background: rgba(31,111,235,0.07); clip-path: polygon(26% 0, 100% 0, 100% 100%, 0 100%); }
  .glow { position: absolute; left: -200px; top: 120px; width: 1500px; height: 820px; opacity: 0;
    background: radial-gradient(closest-side, rgba(31,111,235,0.5) 0%, rgba(31,111,235,0) 72%); pointer-events: none; }

  .copy { position: absolute; left: 5cqw; top: 232px; width: 60cqw; z-index: 3; }
  .accent-line { width: 60px; height: 4px; border-radius: 2px; background: #1f6feb; opacity: 0; }
  .eyebrow { margin-top: 26px; font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.16em; text-transform: uppercase; color: #1f6feb; opacity: 0; }
  .headline { margin: 18px 0 0; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 92px; line-height: 1.06; letter-spacing: -0.025em; color: #0b1b2b; }
  .hl-line { display: block; white-space: nowrap; overflow: hidden; }
  .hl-line span { display: inline-block; }

  /* terminal */
  .term { position: absolute; right: 5cqw; top: 300px; width: 620px; border-radius: 14px; overflow: hidden;
    background: #0b1b2b; border: 1.5px solid rgba(31,111,235,0.28); opacity: 0; z-index: 4; }
  .term-bar { height: 42px; background: #0f2438; display: flex; align-items: center; padding: 0 16px; gap: 8px; }
  .tdot { width: 11px; height: 11px; border-radius: 50%; }
  .term-title { margin-left: 12px; font-family: "JetBrains Mono", monospace; font-size: 13px; color: #7fa8d9; }
  .term-body { padding: 22px 24px 28px; font-family: "JetBrains Mono", monospace; font-size: 18px; line-height: 1.85; }
  .t-line { color: #cfe2ff; white-space: pre; }
  .t-prompt { color: #4ea3ff; }
  .t-warn { color: #ffb454; }
  .t-crit { color: #ff6b6b; font-weight: 500; }
  .caret { display: inline-block; width: 10px; height: 20px; background: #4ea3ff; vertical-align: -3px; margin-left: 2px; }

  .dot-grid { position: absolute; right: 150px; top: 116px; display: grid; grid-template-columns: repeat(3, 10px); gap: 15px; z-index: 2; opacity: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #1f6feb; opacity: 0.55; }
</style>
</head>
<body>
<div data-hf-id="hf-lutg" id="root" data-composition-id="01-hook" data-width="1920" data-height="1080">
  <div data-hf-id="hf-ygft" class="ground"></div>
  <div data-hf-id="hf-pl4y" class="grid-bg" id="hk-grid"></div>
  <div data-hf-id="hf-ozks" class="diag-panel"></div>
  <div data-hf-id="hf-3v9o" class="glow" id="hk-glow"></div>

  <div data-hf-id="hf-hwvk" class="dot-grid" id="hk-dots">
    <span data-hf-id="hf-9gry" class="dot"></span><span data-hf-id="hf-zcc2" class="dot"></span><span data-hf-id="hf-zqn3" class="dot"></span>
    <span data-hf-id="hf-04y4" class="dot"></span><span data-hf-id="hf-0j95" class="dot"></span><span data-hf-id="hf-0xk6" class="dot"></span>
    <span data-hf-id="hf-1bv7" class="dot"></span><span data-hf-id="hf-1q68" class="dot"></span><span data-hf-id="hf-vrkt" class="dot"></span>
  </div>

  <div data-hf-id="hf-fz1q" class="term" id="hk-term">
    <div data-hf-id="hf-vwwm" class="term-bar">
      <span data-hf-id="hf-ue1w" class="tdot" style="background:#ff5f57"></span>
      <span data-hf-id="hf-te40" class="tdot" style="background:#febc2e"></span>
      <span data-hf-id="hf-u1wi" class="tdot" style="background:#28c840"></span>
      <span data-hf-id="hf-mnsc" class="term-title">ssh you@your-vps</span>
    </div>
    <div data-hf-id="hf-ty2f" class="term-body">
      <div data-hf-id="hf-tzya" class="t-line" id="hk-t1"><span data-hf-id="hf-2yha" class="t-prompt">$</span> <span data-hf-id="hf-bx8i" id="hk-cmd"></span><span data-hf-id="hf-oemp" class="caret" id="hk-caret"></span></div>
      <div data-hf-id="hf-2guf" class="t-line t-warn" id="hk-t2">/dev/sda1   98% used   36G free</div>
      <div data-hf-id="hf-humn" class="t-line t-crit" id="hk-t3">! disk pressure — 3 containers evicted</div>
    </div>
  </div>

  <div data-hf-id="hf-bdx3" class="copy">
    <div data-hf-id="hf-rydj" class="accent-line" id="hk-accent"></div>
    <div data-hf-id="hf-meif" class="eyebrow" id="hk-eyebrow">ANCHOR</div>
    <h1 data-hf-id="hf-3ubu" class="headline">
      <span data-hf-id="hf-55ow" class="hl-line"><span data-hf-id="hf-s3pj" id="hk-l1">Own your server.</span></span>
      <span data-hf-id="hf-zb3c" class="hl-line"><span data-hf-id="hf-tiwr" id="hk-l2">Don't babysit it.</span></span>
    </h1>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  var $ = function (id) { return document.getElementById(id); };
  var TOTAL = 8;

  gsap.set([$("hk-t2"), $("hk-t3")], { opacity: 0 });
  gsap.set([$("hk-l1"), $("hk-l2")], { yPercent: 115, opacity: 0 });

  // terminal arrives first — establishes the pain
  tl.fromTo($("hk-term"), { opacity: 0, y: 28, scale: 0.985 },
    { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 0.15);

  // typed command (seek-safe: derived from tween progress, not callbacks)
  var CMD = "df -h  # again?";
  var typer = { n: 0 };
  tl.to(typer, {
    n: CMD.length, duration: 1.05, ease: "none",
    onUpdate: function () { $("hk-cmd").textContent = CMD.slice(0, Math.round(typer.n)); }
  }, 0.55);

  tl.to($("hk-caret"), { opacity: 0, duration: 0.36, repeat: 6, yoyo: true, ease: "steps(1)" }, 1.6);
  tl.fromTo($("hk-t2"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 1.75);
  tl.fromTo($("hk-t3"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 2.15);
  // the alert stings
  tl.fromTo($("hk-t3"), { scale: 1 }, { scale: 1.035, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.inOut", transformOrigin: "0% 50%" }, 2.4);

  // headline answers the terminal
  tl.fromTo($("hk-accent"), { scaleX: 0, opacity: 0, transformOrigin: "0% 50%" },
    { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 2.7);
  tl.fromTo($("hk-eyebrow"), { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 2.9);
  tl.to($("hk-l1"), { yPercent: 0, opacity: 1, duration: 0.72, ease: "power4.out" }, 3.05);
  tl.to($("hk-l2"), { yPercent: 0, opacity: 1, duration: 0.72, ease: "power4.out" }, 3.28);

  tl.fromTo($("hk-grid"), { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.out" }, 2.8);
  tl.fromTo($("hk-dots"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(2)" }, 3.5);
  tl.fromTo($("hk-glow"), { opacity: 0, scale: 0.92 }, { opacity: 0.22, scale: 1, duration: 1.1, ease: "power2.out" }, 3.0);

  // single living element: slow camera drift on the terminal
  tl.to($("hk-term"), { y: -14, duration: TOTAL - 3.4, ease: "sine.inOut" }, 3.4);

  tl.to({}, { duration: TOTAL }, 0);
  window.__timelines["01-hook"] = tl;
})();
</script>
</body>
</html>
