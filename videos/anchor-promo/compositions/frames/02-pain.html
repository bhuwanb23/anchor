<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap");
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; container-type: size; font-family: "Inter", system-ui, sans-serif; background: #f6f8fa; }
  .ground { position: absolute; inset: 0; background: #f6f8fa; }
  .grid-bg { position: absolute; inset: 0; opacity: 0.55;
    background-image: linear-gradient(rgba(31,111,235,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(31,111,235,0.05) 1px, transparent 1px);
    background-size: 64px 64px; }

  .header { position: absolute; left: 5cqw; top: 118px; z-index: 3; }
  .accent-line { width: 60px; height: 4px; border-radius: 2px; background: #1f6feb; opacity: 0; }
  .eyebrow { margin-top: 22px; font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.16em; text-transform: uppercase; color: #1f6feb; opacity: 0; }
  .h2 { margin: 16px 0 0; font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 62px; line-height: 1.08; letter-spacing: -0.025em; color: #0b1b2b; opacity: 0; }

  .row { position: absolute; left: 5cqw; right: 5cqw; top: 350px; display: flex; gap: 30px; z-index: 3; }
  .card { flex: 1; background: #fff; border: 1.5px solid rgba(31,111,235,0.2); border-radius: 16px; padding: 32px 34px 30px; opacity: 0; }
  .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .badge { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .badge svg { width: 22px; height: 22px; }
  .card-time { font-family: "JetBrains Mono", monospace; font-size: 14px; color: #64748b; letter-spacing: 0.02em; }
  .card-title { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 34px; line-height: 1.2; letter-spacing: -0.02em; color: #0b1b2b; margin-bottom: 20px; }

  /* disk meter */
  .meter { height: 12px; border-radius: 6px; background: rgba(31,111,235,0.1); overflow: hidden; }
  .meter-fill { height: 100%; width: 0%; border-radius: 6px; background: #e8833a; }
  .meter-label { display: flex; justify-content: space-between; margin-top: 12px; font-family: "JetBrains Mono", monospace; font-size: 15px; color: #64748b; }
  .meter-val { color: #c2410c; font-weight: 500; }

  /* cert countdown */
  .cert { display: flex; align-items: baseline; gap: 10px; }
  .cert-num { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 68px; line-height: 1; color: #c2410c; }
  .cert-unit { font-family: "Inter", sans-serif; font-size: 19px; color: #64748b; }
  .cert-sub { margin-top: 14px; font-family: "JetBrains Mono", monospace; font-size: 15px; color: #64748b; }

  /* pager */
  .pager { display: flex; align-items: center; gap: 16px; }
  .pager-ico { width: 54px; height: 54px; border-radius: 12px; background: rgba(220,38,38,0.08); display: flex; align-items: center; justify-content: center; }
  .pager-ico svg { width: 28px; height: 28px; }
  .pager-txt { font-family: "Inter", sans-serif; font-size: 18px; line-height: 1.5; color: #0b1b2b; }
  .pager-txt b { display: block; font-family: "Space Grotesk", sans-serif; font-weight: 600; color: #b91c1c; font-size: 20px; margin-bottom: 3px; }

  .tally { position: absolute; left: 5cqw; right: 5cqw; top: 742px; z-index: 3;
    background: rgba(31,111,235,0.07); border-left: 5px solid #1f6feb; border-radius: 14px; padding: 30px 38px; opacity: 0; }
  .tally-text { font-family: "Space Grotesk", sans-serif; font-weight: 500; font-size: 38px; letter-spacing: -0.02em; color: #0b1b2b; }
  .tally-text em { font-style: normal; color: #1f6feb; font-weight: 700; }
</style>
</head>
<body>
<div id="root" data-composition-id="02-pain" data-width="1920" data-height="1080">
  <div class="ground"></div>
  <div class="grid-bg"></div>

  <div class="header">
    <div class="accent-line" id="pn-accent"></div>
    <div class="eyebrow" id="pn-eyebrow">THE TAX</div>
    <h2 class="h2" id="pn-h2">The babysit loop.</h2>
  </div>

  <div class="row">
    <div class="card" id="pn-c1">
      <div class="card-head">
        <div class="badge" style="background:rgba(232,131,58,0.12)">
          <svg viewBox="0 0 24 24" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        </div>
        <div class="card-time">tonight · 23:14</div>
      </div>
      <div class="card-title">Full disk.</div>
      <div class="meter"><div class="meter-fill" id="pn-meter"></div></div>
      <div class="meter-label"><span>/dev/sda1</span><span class="meter-val"><span id="pn-pct">0</span>% used</span></div>
    </div>

    <div class="card" id="pn-c2">
      <div class="card-head">
        <div class="badge" style="background:rgba(232,131,58,0.12)">
          <svg viewBox="0 0 24 24" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        </div>
        <div class="card-time">tomorrow · 04:00</div>
      </div>
      <div class="card-title">Expired certificate.</div>
      <div class="cert"><span class="cert-num" id="pn-days">14</span><span class="cert-unit">days left</span></div>
      <div class="cert-sub">auto-renew: not configured</div>
    </div>

    <div class="card" id="pn-c3">
      <div class="card-head">
        <div class="badge" style="background:rgba(220,38,38,0.1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </div>
        <div class="card-time">2:00 AM</div>
      </div>
      <div class="card-title">The page.</div>
      <div class="pager">
        <div class="pager-ico" id="pn-bell">
          <svg viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"><path d="M12 2v4"/><circle cx="12" cy="14" r="7"/><path d="M12 11v3l2 2"/></svg>
        </div>
        <div class="pager-txt"><b>site down · 14 min</b>you, awake, again</div>
      </div>
    </div>
  </div>

  <div class="tally" id="pn-tally">
    <div class="tally-text">Another hour gone to a machine <em>you already pay for.</em></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  var $ = function (id) { return document.getElementById(id); };
  var TOTAL = 9;

  tl.fromTo($("pn-accent"), { scaleX: 0, opacity: 0, transformOrigin: "0% 50%" },
    { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);
  tl.fromTo($("pn-eyebrow"), { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.22);
  tl.fromTo($("pn-h2"), { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.36);

  // three scenarios land in sequence, each with its own data telling the story
  [["pn-c1", 1.05], ["pn-c2", 1.42], ["pn-c3", 1.79]].forEach(function (p) {
    tl.fromTo($(p[0]), { opacity: 0, y: 54, scale: 0.97 },
      { opacity: 1, y: 0, scale: 1, duration: 0.62, ease: "back.out(1.5)" }, p[1]);
  });

  // disk fills toward the red line
  var disk = { v: 0 };
  tl.to(disk, {
    v: 98, duration: 1.5, ease: "power2.inOut",
    onUpdate: function () {
      $("pn-meter").style.width = disk.v + "%";
      $("pn-pct").textContent = Math.round(disk.v);
    }
  }, 1.75);

  // cert counts down
  var cert = { d: 14 };
  tl.to(cert, {
    d: 0, duration: 1.5, ease: "power2.in",
    onUpdate: function () { $("pn-days").textContent = Math.max(0, Math.round(cert.d)); }
  }, 2.15);

  // pager shakes
  tl.to($("pn-bell"), { rotation: 13, duration: 0.07, repeat: 9, yoyo: true, ease: "power1.inOut", transformOrigin: "50% 20%" }, 2.6);

  tl.fromTo($("pn-tally"), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 4.35);

  // the cost keeps mounting — one living element
  tl.to($("pn-tally"), { scale: 1.012, duration: 1.6, yoyo: true, repeat: 1, ease: "sine.inOut", transformOrigin: "0% 50%" }, 5.3);

  tl.to({}, { duration: TOTAL }, 0);
  window.__timelines["02-pain"] = tl;
})();
</script>
</body>
</html>
