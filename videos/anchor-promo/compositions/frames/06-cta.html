<!DOCTYPE html>

<style>

  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; container-type: size; font-family: "Inter", system-ui, sans-serif; background: #f6f8fa; }
  .ground { position: absolute; inset: 0; background: #f6f8fa; }
  .rings { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  #cta-rotor { transform-origin: 960px 430px; transform-box: view-box; }
  .glow { position: absolute; left: 50%; top: 430px; width: 1200px; height: 700px; transform: translate(-50%, -50%); opacity: 0;
    background: radial-gradient(closest-side, rgba(31,111,235,0.4) 0%, rgba(31,111,235,0) 70%); pointer-events: none; }

  .block { position: absolute; left: 0; top: 214px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 3; }
  .accent-line { width: 240px; height: 4px; border-radius: 2px; background: #1f6feb; opacity: 0; }
  .headline { margin: 30px 0 0; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 92px; line-height: 1.04; letter-spacing: -0.028em; color: #0b1b2b; text-align: center; }
  .hl-line { display: block; overflow: hidden; }
  .hl-line span { display: inline-block; }
  .sub { margin-top: 26px; font-family: "Inter", sans-serif; font-size: 23px; line-height: 1.6; color: #0055d6; text-align: center; opacity: 0; }

  /* install command */
  .cmd { margin-top: 40px; display: flex; align-items: center; gap: 16px; background: #0b1b2b; border-radius: 12px; padding: 20px 28px; opacity: 0; }
  .cmd-prompt { font-family: "JetBrains Mono", monospace; font-size: 21px; color: #4ea3ff; }
  .cmd-text { font-family: "JetBrains Mono", monospace; font-size: 21px; color: #cfe2ff; white-space: pre; }
  .cmd-caret { display: inline-block; width: 11px; height: 22px; background: #4ea3ff; vertical-align: -4px; }

  /* github pill */
  .gh { margin-top: 34px; display: flex; align-items: center; gap: 14px; background: #1f6feb; color: #f6f8fa; border-radius: 100px; padding: 22px 44px; opacity: 0; }
  .gh svg { width: 30px; height: 30px; }
  .gh-text { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 28px; letter-spacing: -0.01em; }

  .meta { margin-top: 30px; display: flex; gap: 34px; opacity: 0; }
  .meta-item { display: flex; align-items: center; gap: 9px; font-family: "Inter", sans-serif; font-size: 17px; color: #64748b; }
  .meta-dot { width: 8px; height: 8px; border-radius: 50%; background: #1f6feb; }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  var $ = function (id) { return document.getElementById(id); };
  var TOTAL = 11;

  gsap.set([$("cta-l1"), $("cta-l2")], { yPercent: 115, opacity: 0 });

  tl.fromTo($("cta-accent"), { scaleX: 0, opacity: 0, transformOrigin: "50% 50%" },
    { scaleX: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.2);
  tl.to($("cta-l1"), { yPercent: 0, opacity: 1, duration: 0.75, ease: "power4.out" }, 0.4);
  tl.to($("cta-l2"), { yPercent: 0, opacity: 1, duration: 0.75, ease: "power4.out" }, 0.62);
  tl.fromTo($("cta-sub"), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.25);

  tl.fromTo($("cta-glow"), { opacity: 0, scale: 0.9 }, { opacity: 0.18, scale: 1, duration: 1.2, ease: "power2.out" }, 0.5);
  [["cta-r1", 0.55], ["cta-r2", 0.7], ["cta-r3", 0.85]].forEach(function (p) {
    tl.fromTo($(p[0]), { scale: 0.86, opacity: 0, transformOrigin: "960px 430px" },
      { scale: 1, opacity: 1, duration: 0.9, ease: "power3.out" }, p[1]);
  });

  // install command types out
  tl.fromTo($("cta-cmd"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.75);
  var CMD = "git clone github.com/bhuwanb23/anchor && make dev";
  var typer = { n: 0 };
  tl.to(typer, {
    n: CMD.length, duration: 1.5, ease: "none",
    onUpdate: function () { $("cta-cmd-text").textContent = CMD.slice(0, Math.round(typer.n)); }
  }, 2.05);
  tl.to($("cta-caret"), { opacity: 0, duration: 0.4, repeat: 12, yoyo: true, ease: "steps(1)" }, 3.6);

  // the one solid element lands
  tl.fromTo($("cta-gh"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.9)" }, 4.0);
  tl.fromTo($("cta-meta"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.5);

  // held close — only the ring turns
  var spin = { deg: 0 };
  tl.to(spin, {
    deg: 300, duration: TOTAL - 1.2, ease: "none",
    onUpdate: function () { $("cta-rotor").setAttribute("transform", "rotate(" + spin.deg + " 960 430)"); }
  }, 1.2);

  tl.to({}, { duration: TOTAL }, 0);
  window.__timelines["06-cta"] = tl;
})();
</script>
