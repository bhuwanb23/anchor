<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap");
  #root { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
  .caption-stage { position: absolute; left: 0; right: 0; top: 892px; height: 172px; display: flex; align-items: center; justify-content: center; }
  .caption-group { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
  .caption-pill { max-width: 76%; padding: 18px 42px 22px; background: rgba(31,111,235,0.055); border: 1.5px solid rgba(31,111,235,0.2); border-radius: 14px; backdrop-filter: blur(2px); }
  .caption-line { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.08em 0.3em;
    font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 600; font-size: 44px; line-height: 1.18; letter-spacing: -0.02em; }
  .caption-word { display: inline-block; padding: 0 0.16em; border-radius: 0.3em; color: #8ba3bd; }
  .caption-word.is-active { color: #f6f8fa; background: #1f6feb; }
  .caption-word.is-spoken { color: #0b1b2b; background: transparent; }
</style>
</head>
<body>
<div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
  <div class="caption-stage" id="caption-stage"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var DURATION = 60;

  // Narration lines timed to the frame beats. Captions carry the voice (no VO track).
  var GROUPS = [
    { start: 0.5,  end: 4.0,  text: "You own a server. It runs your business." },
    { start: 4.2,  end: 7.5,  text: "It shouldn't run you." },
    { start: 8.4,  end: 12.4, text: "Tonight it's a full disk. Tomorrow, an expired certificate." },
    { start: 12.6, end: 16.6, text: "Another hour gone to a machine you already pay for." },
    { start: 17.5, end: 21.2, text: "Anchor turns it into your own private cloud —" },
    { start: 21.4, end: 24.6, text: "and the dashboard is the only thing you touch." },
    { start: 25.5, end: 29.4, text: "A small agent lives on your server." },
    { start: 29.6, end: 33.4, text: "Your apps stay on hardware you own, with automatic HTTPS —" },
    { start: 33.6, end: 36.7, text: "while health and commands travel over one connection." },
    { start: 37.5, end: 41.2, text: "It deploys from Git or Docker," },
    { start: 41.4, end: 44.9, text: "backs everything up every night," },
    { start: 45.1, end: 48.7, text: "and if something breaks, it tells you in plain English what happened." },
    { start: 49.6, end: 53.5, text: "Bring any five-dollar box." },
    { start: 53.7, end: 58.6, text: "Leave the babysitting to Anchor." }
  ];

  // Deterministic word timing: distribute each group's window across its words,
  // weighted by word length so longer words hold longer. No randomness, no clocks.
  GROUPS.forEach(function (g) {
    var parts = g.text.split(/\s+/).filter(Boolean);
    var weights = parts.map(function (w) { return w.length + 2; });
    var total = weights.reduce(function (a, b) { return a + b; }, 0);
    var span = g.end - g.start;
    var acc = 0;
    g.words = parts.map(function (w, i) {
      var s = g.start + (acc / total) * span;
      acc += weights[i];
      var e = g.start + (acc / total) * span;
      return { text: w, start: s, end: e };
    });
  });

  var stage = document.getElementById("caption-stage");
  GROUPS.forEach(function (group, gi) {
    var groupEl = document.createElement("div");
    groupEl.className = "caption-group";
    groupEl.id = "cap-g-" + gi;
    var pill = document.createElement("div");
    pill.className = "caption-pill";
    var line = document.createElement("div");
    line.className = "caption-line";
    group.words.forEach(function (w, wi) {
      var span = document.createElement("span");
      span.className = "caption-word";
      span.id = "cap-w-" + gi + "-" + wi;
      span.textContent = w.text;
      line.appendChild(span);
    });
    pill.appendChild(line);
    groupEl.appendChild(pill);
    stage.appendChild(groupEl);
  });

  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  GROUPS.forEach(function (group, gi) {
    var groupEl = document.getElementById("cap-g-" + gi);
    tl.fromTo(groupEl, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.24, ease: "power2.out" }, group.start);
    tl.to(groupEl, { opacity: 0, duration: 0.2, ease: "power2.in" }, group.end);

    group.words.forEach(function (w, wi) {
      var el = document.getElementById("cap-w-" + gi + "-" + wi);
      // 3-state karaoke via className sets — seek-safe (gsap.set applies on frame seek)
      tl.set(el, { className: "caption-word" }, group.start);
      tl.set(el, { className: "caption-word is-active" }, w.start);
      if (wi + 1 < group.words.length) {
        tl.set(el, { className: "caption-word is-spoken" }, group.words[wi + 1].start);
      } else {
        tl.set(el, { className: "caption-word is-spoken" }, Math.min(group.end, w.end));
      }
    });
  });

  tl.to({}, { duration: DURATION }, 0);
  window.__timelines["captions"] = tl;
})();
</script>
</body>
</html>
